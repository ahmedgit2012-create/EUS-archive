<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EUS Archive</title>
<meta name="description" content="Bilingual (Arabic / English) endoscopic ultrasound reporting and archive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=1.2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4 4 26a26 26 0 0 0 24 0Z' fill='%230e6973'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#archive" aria-label="EUS Archive">
    <span class="brand-mark" data-ico="fan" data-ico-cls="xl"></span>
    <span><b data-t="appName">EUS Archive</b><small data-t="appSub"></small></span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="#archive" data-v="archive" data-ico="archive"><span data-t="navArchive">Archive</span></a>
    <a href="#edit" data-v="new" data-ico="newdoc"><span data-t="navNew">New report</span></a>
    <a href="#stats" data-v="stats" data-ico="stats"><span data-t="navStats">Statistics</span></a>
    <a href="#settings" data-v="settings" data-ico="gear"><span data-t="navSettings">Settings</span></a>
  </nav>
  <button class="lang-btn" id="langBtn" type="button" data-ico="globe"><span data-t="langSwitch">English</span></button>
</header>
<main id="main" class="main"></main>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This program needs JavaScript. / يحتاج هذا البرنامج إلى تفعيل JavaScript.</p></noscript>
<div id="printArea" class="print-area" aria-hidden="true"></div>
<script src="js/i18n.js?v=1.2"></script>
<script src="js/icons.js?v=1.2"></script>
<script src="js/db.js?v=1.2"></script>
<script src="js/schema.js?v=1.2"></script>
<script src="js/app.js?v=1.2"></script>
<script src="js/report.js?v=1.2"></script>
<script src="js/print.js?v=1.2"></script>
<script src="js/views.js?v=1.2"></script>
</body>
</html>
