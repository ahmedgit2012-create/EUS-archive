<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EUS Archive</title>
<meta name="description" content="Bilingual (Arabic / English) endoscopic ultrasound reporting and archive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4 4 26a26 26 0 0 0 24 0Z' fill='%230e6973'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#archive" aria-label="EUS Archive">
    <svg class="brand-mark" viewBox="0 0 40 32" aria-hidden="true">
      <path d="M20 3 5 27a30 30 0 0 0 30 0Z" class="fan"/>
      <path d="M8.6 21.5a24 24 0 0 0 22.8 0M11.4 16.5a18 18 0 0 0 17.2 0M14.2 11.5a12 12 0 0 0 11.6 0" class="arcs"/>
      <circle cx="21.5" cy="20" r="2.6" class="echo"/>
    </svg>
    <span><b data-t="appName">EUS Archive</b><small data-t="appSub"></small></span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="#archive" data-v="archive" data-t="navArchive">Archive</a>
    <a href="#edit" data-v="new" data-t="navNew">New report</a>
    <a href="#stats" data-v="stats" data-t="navStats">Statistics</a>
    <a href="#settings" data-v="settings" data-t="navSettings">Settings</a>
  </nav>
  <button class="lang-btn" id="langBtn" type="button" data-t="langSwitch">English</button>
</header>
<main id="main" class="main"></main>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This program needs JavaScript. / يحتاج هذا البرنامج إلى تفعيل JavaScript.</p></noscript>
<script src="js/i18n.js"></script>
<script src="js/db.js"></script>
<script src="js/schema.js"></script>
<script src="js/app.js"></script>
<script src="js/report.js"></script>
<script src="js/views.js"></script>
</body>
</html>
